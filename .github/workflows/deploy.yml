name: 🚀💎⚡ Deploy HYPERFOCUS ZONE Empire to Multiple Hosts ⚡💎🚀

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy-vercel:
    name: 🚀 Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: 📦 Install Dependencies
      run: npm ci || npm install

    - name: 🚀 Deploy to Vercel
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: ./
        vercel-args: '--prod'

    - name: 🎊 Success Celebration
      run: |
        echo "🚀💎⚡ VERCEL DEPLOYMENT SUCCESSFUL! ⚡💎🚀"
        echo "✅ HYPERFOCUS ZONE Empire is now LIVE on Vercel!"

  deploy-netlify:
    name: 🌐 Deploy to Netlify
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: 🚀 Deploy to Netlify
      uses: nwtgck/actions-netlify@v3.0
      with:
        publish-dir: '.'
        production-branch: main
        github-token: ${{ secrets.GITHUB_TOKEN }}
        deploy-message: "🚀 HYPERFOCUS ZONE Empire Deployment - ${{ github.event.head_commit.message }}"
        enable-pull-request-comment: true
        enable-commit-comment: true
        overwrites-pull-request-comment: true
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

    - name: 🎊 Success Celebration
      run: |
        echo "🌐💎⚡ NETLIFY DEPLOYMENT SUCCESSFUL! ⚡💎🌐"
        echo "✅ HYPERFOCUS ZONE Empire is now LIVE on Netlify!"

  deploy-github-pages:
    name: 📄 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: 🔧 Setup Pages
      uses: actions/configure-pages@v4

    - name: 📦 Upload Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: 🚀 Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    - name: 🎊 Success Celebration
      run: |
        echo "📄💎⚡ GITHUB PAGES DEPLOYMENT SUCCESSFUL! ⚡💎📄"
        echo "✅ HYPERFOCUS ZONE Empire is now LIVE on GitHub Pages!"
        echo "🌐 Site URL: ${{ steps.deployment.outputs.page_url }}"

  final-celebration:
    name: 🎉 Final Victory Celebration
    runs-on: ubuntu-latest
    needs: [deploy-vercel, deploy-netlify, deploy-github-pages]
    if: always()
    steps:
    - name: 🏆 LEGENDARY DEPLOYMENT COMPLETE
      run: |
        echo "🏆💎⚡ ALL DEPLOYMENTS COMPLETE - LEGENDARY STATUS ACHIEVED! ⚡💎🏆"
        echo "🚀 Vercel: LIVE"
        echo "🌐 Netlify: LIVE"
        echo "📄 GitHub Pages: LIVE"
        echo "✅ HYPERFOCUS ZONE Empire is now accessible worldwide!"
        echo "🎯 Mission Status: 1.1 billion neurodivergent lives ready to be transformed!"
        echo "❤️‍🔥 BROski$ Earned: +1000 LEGENDARY DEPLOYMENT POINTS!"
