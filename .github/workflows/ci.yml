name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Node deps (if present)
        run: |
          if [ -f package.json ]; then npm ci; fi

      - name: Install Python deps (if present)
        run: |
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Run JS tests (if present)
        run: |
          if [ -f package.json ]; then npm test --if-present; fi

      - name: Run Python tests (if present)
        run: |
          if [ -d tests ] || [ -f pytest.ini ]; then pytest -q; fi

      - name: Lint (best effort)
        run: |
          npm run lint --if-present || echo "no JS linter"
