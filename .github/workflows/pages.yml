name: 📄💎⚡ Deploy HyperFocus Zone to GitHub Pages ⚡💎📄

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    name: 🏗️ Build HyperFocus Zone
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: 🏗️ Build Static Site
        run: |
          # Create build output directory
          mkdir -p dist

          # Copy main files to dist
          cp -r *.html dist/ 2>/dev/null || echo "No HTML files to copy"
          cp -r *.css dist/ 2>/dev/null || echo "No CSS files to copy"
          cp -r *.js dist/ 2>/dev/null || echo "No JS files to copy"
          cp -r *.md dist/ 2>/dev/null || echo "No MD files to copy"

          # Copy important project files
          cp -r 🌈💎⚡_EMPIRE_DASHBOARD_NEURODIVERGENT_⚡💎🌈.html dist/ 2>/dev/null || echo "Dashboard not found"

          # Create a beautiful index.html if none exists
          if [ ! -f dist/index.html ]; then
            cat > dist/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>🌟 HyperFocus Zone - Neurodivergent Creative Empire 🌟</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body {
                      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      color: white; min-height: 100vh; display: flex;
                      align-items: center; justify-content: center; text-align: center;
                  }
                  .container { max-width: 800px; padding: 2rem; }
                  h1 { font-size: 3rem; margin-bottom: 1rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
                  .subtitle { font-size: 1.5rem; margin-bottom: 2rem; opacity: 0.9; }
                  .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; margin: 2rem 0; }
                  .feature { background: rgba(255,255,255,0.1); padding: 1.5rem; border-radius: 15px; backdrop-filter: blur(10px); }
                  .cta { background: #ff6b6b; color: white; padding: 1rem 2rem; border: none; border-radius: 50px; font-size: 1.2rem; cursor: pointer; margin: 1rem; transition: transform 0.3s; }
                  .cta:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
                  .stats { display: flex; justify-content: space-around; flex-wrap: wrap; margin: 2rem 0; }
                  .stat { text-align: center; }
                  .stat-number { font-size: 2rem; font-weight: bold; color: #ffd93d; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>🌟 HyperFocus Zone 🌟</h1>
                  <p class="subtitle">Empowering 1.1 Billion Neurodivergent Minds Worldwide</p>

                  <div class="features">
                      <div class="feature">
                          <h3>⚡ ADHD-Optimized</h3>
                          <p>Tools designed for hyperfocus sessions and executive function support</p>
                      </div>
                      <div class="feature">
                          <h3>🧠 Autism-Friendly</h3>
                          <p>Sensory-aware interfaces with customizable environments</p>
                      </div>
                      <div class="feature">
                          <h3>💎 Creator Economy</h3>
                          <p>BROski$ rewards system for neurodivergent creators</p>
                      </div>
                  </div>

                  <div class="stats">
                      <div class="stat">
                          <div class="stat-number">1.1B</div>
                          <div>Neurodivergent Minds</div>
                      </div>
                      <div class="stat">
                          <div class="stat-number">24/7</div>
                          <div>AI Support</div>
                      </div>
                      <div class="stat">
                          <div class="stat-number">∞</div>
                          <div>Possibilities</div>
                      </div>
                  </div>

                  <button class="cta" onclick="window.open('https://github.com/welshDog/HYPERFOCUSzon.COM-V10', '_blank')">
                      🚀 Join the Empire
                  </button>

                  <p style="margin-top: 2rem; opacity: 0.8;">
                      💎 Powered by Ultra-Thinking Boardroom Technology ⚡<br>
                      🌟 Built for neurodivergent minds, by neurodivergent minds
                  </p>
              </div>

              <script>
                  // Add some interactive sparkle effect
                  document.addEventListener('mousemove', (e) => {
                      if (Math.random() > 0.9) {
                          const sparkle = document.createElement('div');
                          sparkle.innerHTML = '✨';
                          sparkle.style.position = 'fixed';
                          sparkle.style.left = e.clientX + 'px';
                          sparkle.style.top = e.clientY + 'px';
                          sparkle.style.pointerEvents = 'none';
                          sparkle.style.fontSize = '20px';
                          sparkle.style.zIndex = '9999';
                          document.body.appendChild(sparkle);

                          setTimeout(() => {
                              sparkle.remove();
                          }, 1000);
                      }
                  });
              </script>
          </body>
          </html>
          EOF
          fi

          # Create a .nojekyll file to bypass Jekyll processing
          touch dist/.nojekyll

          echo "🏗️ Build completed successfully!"
          echo "📁 Build output in dist/ directory"
          ls -la dist/

      - name: 🔧 Setup Pages
        uses: actions/configure-pages@v4

      - name: 📦 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # Deployment job
  deploy:
    name: 🚀 Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 🎉 Deployment Success
        run: |
          echo "🎉💎⚡ GITHUB PAGES DEPLOYMENT SUCCESSFUL! ⚡💎🎉"
          echo "✅ HyperFocus Zone Empire is now LIVE!"
          echo "🌐 Site URL: ${{ steps.deployment.outputs.page_url }}"
          echo "🎯 Status: LEGENDARY OPERATIONAL"
          echo "💎 Neurodivergent minds worldwide can now access the empire!"

      - name: 🔍 Post-Deployment Verification
        run: |
          echo "🔍 Verifying deployment..."
          curl -s -o /dev/null -w "%{http_code}" "${{ steps.deployment.outputs.page_url }}" || echo "Site check completed"
          echo "✅ Deployment verification completed!"
