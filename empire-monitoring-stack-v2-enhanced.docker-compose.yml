# 🚀💎⚡ EMPIRE MONITORING STACK V2.0 - ENHANCED DOCKER MONITORING ⚡💎🚀
# Docker Compose v2+ configuration

name: empire-monitoring-v2

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-empire
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ./grafana-config/prometheus-empire-enhanced.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - empire-monitoring

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana-empire
    restart: unless-stopped
    ports:
      - "3001:3000"  # Using 3001 to avoid conflict with your Ultra dOoK Portal
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=BROski2025!
      - GF_FEATURE_TOGGLES_ENABLE=grafanaAdvisor,alertingListViewV2,trendlines,contextualRootCause,dockerContainerLogs
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel,redis-datasource
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-config/custom.ini:/etc/grafana/grafana.ini:ro
      - ./grafana-config/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana-config/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - empire-monitoring

  # 🔍 ADVANCED DOCKER MONITORING: cAdvisor for Container Metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor-empire
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    networks:
      - empire-monitoring
    labels:
      - "empire.service=container-monitoring"
      - "empire.tier=infrastructure"

  # 📊 HOST SYSTEM MONITORING: Node Exporter for Host Metrics  
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter-empire
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - empire-monitoring
    labels:
      - "empire.service=host-monitoring"
      - "empire.tier=infrastructure"

  # 📝 LOG COLLECTION: Loki for Container Log Aggregation
  loki:
    image: grafana/loki:latest
    container_name: loki-empire
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./grafana-config/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - empire-monitoring
    labels:
      - "empire.service=log-aggregation"
      - "empire.tier=infrastructure"

  # 🚀 LOG SHIPPING: Promtail for Container Log Collection
  promtail:
    image: grafana/promtail:latest
    container_name: promtail-empire
    restart: unless-stopped
    volumes:
      - ./grafana-config/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - empire-monitoring
    labels:
      - "empire.service=log-shipping"
      - "empire.tier=infrastructure"

  # 🎯 REDIS FOR CACHING (Optional - for advanced dashboards)
  redis:
    image: redis:alpine
    container_name: redis-empire
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - empire-monitoring
    labels:
      - "empire.service=caching"
      - "empire.tier=infrastructure"

  # 🔍 DOCKER SOCKET PROXY (Security best practice)
  dockerproxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: dockerproxy-empire
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - NODES=1
      - SERVICES=1
      - TASKS=1
      - VOLUMES=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - empire-monitoring
    labels:
      - "empire.service=docker-proxy"
      - "empire.tier=security"

volumes:
  grafana-data:
    driver: local
    labels:
      - "empire.volume=grafana-storage"
  prometheus-data:
    driver: local
    labels:
      - "empire.volume=prometheus-storage"
  loki-data:
    driver: local
    labels:
      - "empire.volume=loki-storage"
  redis-data:
    driver: local
    labels:
      - "empire.volume=redis-storage"

networks:
  empire-monitoring:
    driver: bridge
    labels:
      - "empire.network=monitoring"

# 🏰 EMPIRE MONITORING STACK V2.0 FEATURES:
# ✅ Prometheus - Metrics collection and storage
# ✅ Grafana v12.1 - Visualization with latest features
# ✅ cAdvisor - Container resource monitoring
# ✅ Node Exporter - Host system monitoring  
# ✅ Loki - Log aggregation system
# ✅ Promtail - Log collection agent
# ✅ Redis - Caching for advanced dashboards
# ✅ Docker Socket Proxy - Secure Docker API access
# ✅ Custom empire labels and network isolation
