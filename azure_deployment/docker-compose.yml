version: '3.8'
services:
  smollm2-engine:
    image: smollm2-hyperfocus:latest
    ports:
      - "11435:11435"
    environment:
      - AI_MODE=LEGENDARY
      - PERFORMANCE_LEVEL=MAXIMUM
    restart: unless-stopped

  gradio-interface:
    image: gradio-hyperfocus:latest
    ports:
      - "7860:7860"
    environment:
      - SMOLLM2_ENDPOINT=http://smollm2-engine:11435
      - UI_MODE=HYPERFOCUS
    depends_on:
      - smollm2-engine
    restart: unless-stopped
