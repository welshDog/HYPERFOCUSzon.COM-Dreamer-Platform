# 🚀💎⚡ PROMETHEUS EMPIRE CONFIGURATION V2.0 - ENHANCED DOCKER MONITORING ⚡💎🚀

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    empire: 'HyperFocus-Zone'
    environment: 'production'
    monitoring_version: 'v2.0-enhanced'

# Alertmanager configuration (for future expansion)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'
rule_files:
  - "empire_alert_rules.yml"

# Scrape configuration for all empire services
scrape_configs:
  # 🏰 CORE EMPIRE SERVICES
  - job_name: 'prometheus-empire'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          tier: 'core'
          empire_component: 'metrics-storage'

  - job_name: 'grafana-empire'
    static_configs:
      - targets: ['grafana-empire:3000']
        labels:
          service: 'grafana'
          tier: 'core' 
          empire_component: 'visualization'

  # 🔍 DOCKER CONTAINER MONITORING
  - job_name: 'cadvisor-empire'
    static_configs:
      - targets: ['cadvisor-empire:8080']
        labels:
          service: 'cadvisor'
          tier: 'infrastructure'
          empire_component: 'container-monitoring'
    scrape_interval: 10s
    metrics_path: /metrics

  # 📊 HOST SYSTEM MONITORING
  - job_name: 'node-exporter-empire'
    static_configs:
      - targets: ['node-exporter-empire:9100']
        labels:
          service: 'node-exporter'
          tier: 'infrastructure'
          empire_component: 'host-monitoring'
    scrape_interval: 10s

  # 📝 LOG SYSTEM MONITORING
  - job_name: 'loki-empire'
    static_configs:
      - targets: ['loki-empire:3100']
        labels:
          service: 'loki'
          tier: 'infrastructure'
          empire_component: 'log-aggregation'

  # 🎯 REDIS MONITORING
  - job_name: 'redis-empire'
    static_configs:
      - targets: ['redis-empire:6379']
        labels:
          service: 'redis'
          tier: 'infrastructure'
          empire_component: 'caching'

  # 🌐 ULTRA DOOK PORTAL MONITORING (if running)
  - job_name: 'ultra-dook-portal'
    static_configs:
      - targets: ['host.docker.internal:3000']
        labels:
          service: 'ultra-dook-portal'
          tier: 'application'
          empire_component: 'productivity-portal'
    scrape_interval: 30s
    metrics_path: /metrics
    scrape_timeout: 10s

  # 🖥️ WINDOWS HOST METRICS (via WMI exporter if available)
  - job_name: 'windows-host'
    static_configs:
      - targets: ['host.docker.internal:9182']
        labels:
          service: 'windows-wmi-exporter'
          tier: 'infrastructure'
          empire_component: 'windows-monitoring'
    scrape_interval: 30s
    scrape_timeout: 10s

  # 🐳 DOCKER DAEMON MONITORING (via socket proxy)
  - job_name: 'docker-daemon'
    static_configs:
      - targets: ['dockerproxy-empire:2375']
        labels:
          service: 'docker-daemon'
          tier: 'infrastructure'
          empire_component: 'container-runtime'
    scrape_interval: 30s

  # 🏃‍♂️ SELF-MONITORING: Empire Stack Health
  - job_name: 'empire-stack-health'
    static_configs:
      - targets: 
          - 'prometheus-empire:9090'
          - 'grafana-empire:3000'
          - 'cadvisor-empire:8080'
          - 'node-exporter-empire:9100'
          - 'loki-empire:3100'
        labels:
          service: 'empire-health-check'
          tier: 'core'
          empire_component: 'stack-monitoring'
    scrape_interval: 5s
    metrics_path: /metrics

# 🎯 EMPIRE MONITORING TARGETS:
# ✅ Container metrics (CPU, memory, network, disk per container)
# ✅ Host system metrics (Windows machine resources)
# ✅ Docker daemon metrics (container lifecycle, images, volumes)
# ✅ Log system metrics (Loki performance)
# ✅ Cache metrics (Redis performance)
# ✅ Application metrics (Ultra dOoK Portal)
# ✅ Stack health monitoring (all services availability)
