# 🚀💎⚡ GRAFANA EMPIRE DATASOURCES V2.0 - ENHANCED MONITORING ⚡💎🚀

apiVersion: 1

datasources:
  # 📊 PROMETHEUS - Primary metrics datasource
  - name: Prometheus-Empire
    type: prometheus
    access: proxy
    orgId: 1
    url: http://prometheus-empire:9090
    basicAuth: false
    isDefault: true
    version: 1
    editable: true
    jsonData:
      graphiteVersion: "1.1"
      tlsAuth: false
      tlsAuthWithCACert: false
      httpMethod: POST
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: 'loki-empire'

  # 📝 LOKI - Log aggregation datasource
  - name: Loki-Empire
    type: loki
    access: proxy
    orgId: 1
    uid: 'loki-empire'
    url: http://loki-empire:3100
    basicAuth: false
    isDefault: false
    version: 1
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: 'prometheus-empire'
          matcherRegex: "traceID=(\\w+)"
          name: TraceID
          url: "$${__value.raw}"

  # 🎯 REDIS - Caching metrics datasource
  - name: Redis-Empire
    type: redis-datasource
    access: proxy
    orgId: 1
    url: redis://redis-empire:6379
    basicAuth: false
    isDefault: false
    version: 1
    editable: true
    jsonData:
      client: standalone
      poolSize: 5
      timeout: 10
      pingInterval: 0
      pipelineWindow: 0

  # 🔍 CADVISOR - Container metrics (direct access)
  - name: cAdvisor-Empire
    type: prometheus
    access: proxy
    orgId: 1
    url: http://cadvisor-empire:8080
    basicAuth: false
    isDefault: false
    version: 1
    editable: true
    jsonData:
      graphiteVersion: "1.1"
      tlsAuth: false
      tlsAuthWithCACert: false
      httpMethod: GET

  # 📈 NODE EXPORTER - Host system metrics (via Prometheus)
  - name: NodeExporter-Empire
    type: prometheus
    access: proxy
    orgId: 1
    url: http://prometheus-empire:9090
    basicAuth: false
    isDefault: false
    version: 1
    editable: true
    jsonData:
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: 'loki-empire'
      httpMethod: POST
    # Pre-configure common queries for host metrics
    customOptions:
      defaultQuery: 'node_*'

# 🏰 EMPIRE DATASOURCE FEATURES:
# ✅ Prometheus - Complete metrics collection from all empire services
# ✅ Loki - Centralized log aggregation with correlation to metrics
# ✅ Redis - Caching layer monitoring and performance metrics
# ✅ cAdvisor - Direct container resource monitoring access
# ✅ Node Exporter - Host system performance monitoring
# ✅ Cross-datasource correlation and exemplar tracing
