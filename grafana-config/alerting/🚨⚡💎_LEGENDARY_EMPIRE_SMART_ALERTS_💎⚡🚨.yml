# 🚨⚡💎 LEGENDARY EMPIRE SMART ALERTS CONFIGURATION 💎⚡🚨
# AI-Powered Predictive Alerting for BROski Empire

groups:
  - name: empire_legendary_alerts
    interval: 30s
    rules:
      
      # 🏰 EMPIRE CORE SERVICE ALERTS
      - alert: EmpireServiceDown
        expr: up{job=~".*empire.*|.*legendary.*"} == 0
        for: 1m
        labels:
          severity: critical
          empire_level: legendary
          alert_type: service_health
        annotations:
          summary: "🚨 EMPIRE SERVICE DOWN - {{$labels.job}}"
          description: "💀 Critical: {{$labels.job}} has been down for more than 1 minute. Empire operations compromised!"
          runbook_url: "http://localhost:3001/d/empire-troubleshooting"
          action_required: "Immediate investigation and service restart required"

      # 🤖 AI-POWERED PREDICTIVE CPU ALERTING
      - alert: EmpireContainerCPUTrendAlert
        expr: predict_linear(rate(container_cpu_usage_seconds_total{name=~".*empire.*"}[10m])[30m:1m], 1800) > 0.8
        for: 2m
        labels:
          severity: warning
          empire_level: predictive
          alert_type: cpu_trend
        annotations:
          summary: "🔮 PREDICTIVE: High CPU trend detected for {{$labels.name}}"
          description: "⚡ AI Prediction: Container {{$labels.name}} CPU usage trending toward 80% in next 30 minutes. Current trend suggests resource bottleneck."
          action_required: "Consider scaling or optimizing workload before bottleneck occurs"

      # 💾 INTELLIGENT MEMORY MONITORING
      - alert: EmpireMemoryEfficiencyWarning
        expr: (container_memory_usage_bytes{name=~".*empire.*"} / container_spec_memory_limit_bytes{name=~".*empire.*"}) > 0.85
        for: 3m
        labels:
          severity: warning
          empire_level: efficiency
          alert_type: memory_optimization
        annotations:
          summary: "💾 Memory efficiency alert for {{$labels.name}}"
          description: "🧠 Container {{$labels.name}} using {{$value | humanizePercentage}} of allocated memory. Optimization opportunity detected."
          recommendation: "Consider memory optimization or scaling up resources"

      # 🌊 HYPERFOCUS SESSION DISRUPTION ALERT
      - alert: HyperfocusSessionDisruption
        expr: stddev_over_time(rate(container_cpu_usage_seconds_total{name=~".*empire.*"}[5m])[15m:1m]) > 0.3
        for: 5m
        labels:
          severity: info
          empire_level: productivity
          alert_type: focus_disruption
        annotations:
          summary: "🎯 Hyperfocus pattern disruption detected"
          description: "⚡ ADHD Alert: Unusual activity pattern detected in empire services. Potential focus disruption or new optimization opportunity."
          adhd_insight: "High variability in system activity may indicate either distraction or hyperfocus state activation"

      # 🚀 EMPIRE NETWORK VELOCITY ALERT
      - alert: EmpireNetworkVelocityAnomaly
        expr: rate(container_network_receive_bytes_total{name=~".*empire.*"}[5m]) > 10 * avg_over_time(rate(container_network_receive_bytes_total{name=~".*empire.*"}[5m])[1h:5m])
        for: 2m
        labels:
          severity: info
          empire_level: velocity
          alert_type: network_burst
        annotations:
          summary: "🌐 Network velocity burst detected for {{$labels.name}}"
          description: "📈 Network activity 10x above normal. Possible empire expansion, attack, or optimization opportunity!"
          investigation: "Check for: viral content, DDoS, or successful empire scaling"

      # 🖥️ HOST SYSTEM EMPIRE FOUNDATION ALERTS
      - alert: EmpireHostResourceCritical
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.95
        for: 1m
        labels:
          severity: critical
          empire_level: foundation
          alert_type: host_critical
        annotations:
          summary: "🖥️ CRITICAL: Empire host memory exhaustion"
          description: "💥 Host system memory usage at {{$value | humanizePercentage}}. Empire foundation at risk!"
          immediate_action: "Free memory immediately or risk empire service failures"

      # 🎯 TRENDLINE-BASED CAPACITY PLANNING ALERT
      - alert: EmpireCapacityPlanningAlert
        expr: predict_linear(node_filesystem_free_bytes{mountpoint="C:"}[2h], 86400*3) < 1024*1024*1024*10
        for: 5m
        labels:
          severity: warning
          empire_level: planning
          alert_type: capacity_forecast
        annotations:
          summary: "📊 Empire capacity planning alert"
          description: "🔮 AI Forecast: Disk space will be below 10GB in 3 days based on current trends"
          planning_action: "Schedule capacity expansion or cleanup before reaching critical levels"

      # 💎 BROSKI ECONOMY HEALTH MONITOR
      - alert: BroskiEconomyEfficiencyDrop
        expr: avg(rate(container_cpu_usage_seconds_total{name=~".*empire.*"}[5m])) < 0.1 and avg_over_time(rate(container_cpu_usage_seconds_total{name=~".*empire.*"}[5m])[1h:5m]) > 0.3
        for: 10m
        labels:
          severity: info
          empire_level: economy
          alert_type: efficiency_drop
        annotations:
          summary: "💎 BROski economy efficiency drop detected"
          description: "📉 Empire efficiency down {{$value | humanizePercentage}} from 1-hour average. Possible optimization opportunity or scheduled maintenance."
          broski_insight: "Could indicate: successful optimization completion, scheduled downtime, or need for workload adjustment"

      # 🤖 AI ADVISOR HEALTH CHECK
      - alert: GrafanaAdvisorHealthCheck
        expr: up{job="grafana"} == 1 and (time() - grafana_build_info) > 86400
        for: 0s
        labels:
          severity: info
          empire_level: ai_insights
          alert_type: advisor_health
        annotations:
          summary: "🤖 Grafana Advisor health check"
          description: "✅ AI monitoring system operational. Empire observability at legendary status!"
          ai_status: "All AI-powered insights and recommendations available"

      # ⚡ EMPIRE RESTART PATTERN DETECTION
      - alert: EmpireServiceRestartPattern
        expr: changes(up{job=~".*empire.*"}[1h]) > 3
        for: 0s
        labels:
          severity: warning
          empire_level: stability
          alert_type: restart_pattern
        annotations:
          summary: "⚡ Empire service restart pattern detected"
          description: "🔄 Service {{$labels.job}} has restarted {{$value}} times in the last hour. Investigating stability issues."
          pattern_analysis: "High restart frequency may indicate: resource constraints, configuration issues, or external factors"

# 🎯 ALERTMANAGER ROUTING CONFIGURATION
route:
  group_by: ['alertname', 'empire_level']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'empire-default'
  routes:
    - match:
        severity: critical
      receiver: 'empire-critical'
      group_wait: 0s
    - match:
        empire_level: legendary
      receiver: 'empire-legendary-notifications'
    - match:
        alert_type: focus_disruption
      receiver: 'hyperfocus-alerts'
    - match:
        empire_level: predictive
      receiver: 'ai-insights-channel'

receivers:
  - name: 'empire-default'
    webhook_configs:
      - url: 'http://localhost:9093/api/v1/alerts'
        title: '🏰 Empire Alert'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'

  - name: 'empire-critical'
    webhook_configs:
      - url: 'http://localhost:9093/api/v1/alerts'
        title: '🚨 CRITICAL EMPIRE ALERT'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}{{ end }}'
        send_resolved: true

  - name: 'empire-legendary-notifications'
    webhook_configs:
      - url: 'http://localhost:9093/api/v1/alerts'
        title: '👑 Legendary Empire Status'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'

  - name: 'hyperfocus-alerts'
    webhook_configs:
      - url: 'http://localhost:9093/api/v1/alerts'
        title: '⚡ ADHD Hyperfocus Alert'
        text: '{{ range .Alerts }}{{ .Annotations.adhd_insight }}{{ end }}'

  - name: 'ai-insights-channel'
    webhook_configs:
      - url: 'http://localhost:9093/api/v1/alerts'
        title: '🤖 AI Predictive Insights'
        text: '{{ range .Alerts }}🔮 {{ .Annotations.summary }}\n{{ .Annotations.description }}{{ end }}'

# 🎨 INHIBITION RULES (Prevent Alert Spam)
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'empire_level']

  - source_match:
      alert_type: 'service_health'
    target_match_re:
      alert_type: '(cpu_trend|memory_optimization|network_burst)'
    equal: ['job']
