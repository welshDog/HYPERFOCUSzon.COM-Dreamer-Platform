# 🚀💎⚡ PROMTAIL EMPIRE CONFIGURATION - CONTAINER LOG COLLECTION ⚡💎🚀

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki-empire:3100/loki/api/v1/push

scrape_configs:
  # 🐳 DOCKER CONTAINER LOGS
  - job_name: empire-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["logging=promtail"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)' 
        target_label: 'container_name'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'logstream'
      - source_labels: ['__meta_docker_container_label_empire_service']
        target_label: 'empire_service'
      - source_labels: ['__meta_docker_container_label_empire_tier']
        target_label: 'empire_tier'
    pipeline_stages:
      - docker: {}
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - labels:
          stream: logstream
          empire_service: empire_service
          empire_tier: empire_tier

  # 🏰 EMPIRE STACK SPECIFIC LOGS
  - job_name: empire-stack-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: empire-stack
          empire_component: monitoring-stack
          __path__: /var/lib/docker/containers/*/*.log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs:
      - json:
          expressions:
            tag:
          source: attrs
      - regex:
          expression: (?P<container_name>(?:[^|])+)
          source: tag
      - timestamp:
          source: time
          format: RFC3339Nano
      - labels:
          stream:
          container_name:
      - output:
          source: output

  # 📊 GRAFANA LOGS
  - job_name: grafana-empire-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: grafana-logs
          empire_service: grafana
          empire_tier: core
          __path__: /var/lib/docker/containers/grafana-empire*/*.log
    pipeline_stages:
      - docker: {}

  # 🔍 PROMETHEUS LOGS  
  - job_name: prometheus-empire-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: prometheus-logs
          empire_service: prometheus
          empire_tier: core
          __path__: /var/lib/docker/containers/prometheus-empire*/*.log
    pipeline_stages:
      - docker: {}

  # 📈 CADVISOR LOGS
  - job_name: cadvisor-empire-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: cadvisor-logs
          empire_service: cadvisor
          empire_tier: infrastructure
          __path__: /var/lib/docker/containers/cadvisor-empire*/*.log
    pipeline_stages:
      - docker: {}

  # 🖥️ SYSTEM LOGS (if available)
  - job_name: system-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          empire_tier: infrastructure
          __path__: /var/log/**/*.log
    pipeline_stages:
      - timestamp:
          source: timestamp
          format: RFC3339

# 🎯 EMPIRE LOG COLLECTION FEATURES:
# ✅ Docker container log discovery and collection
# ✅ Empire service labeling and categorization  
# ✅ Automatic container metadata extraction
# ✅ JSON log parsing for structured data
# ✅ Timestamp normalization and stream separation
# ✅ Multi-tier log organization (core, infrastructure, application)
