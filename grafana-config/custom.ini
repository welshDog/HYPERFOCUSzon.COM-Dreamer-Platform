# 🔧💎⚡ GRAFANA CUSTOM CONFIGURATION ⚡💎🔧
# Grafana Custom Configuration for HyperFocus Zone Empire
# Date: August 3, 2025

[paths]
# Default paths for data, logs, and plugins
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[server]
# Server configuration
protocol = http
http_addr = 
http_port = 3000
domain = localhost
enforce_domain = false
root_url = %(protocol)s://%(domain)s:%(http_port)s/
serve_from_sub_path = false

[database]
# Database configuration
type = sqlite3
host = 127.0.0.1:3306
name = grafana
user = root
password =

[feature_toggles]
# Enable provisioning feature for automated configuration
provisioning = true

# Enable Kubernetes dashboards for browser-based k8s management
kubernetesDashboards = true

# 🎯 NEW LEGENDARY FEATURES - Grafana 12.1+
grafanaAdvisor = true              # Automated health checks (SOLVES YOUR ISSUE!)
alertingListViewV2 = true          # Redesigned alert rule management
trendlines = true                  # Predictive data analysis
contextualRootCause = true         # AI-powered problem detection

# Additional feature toggles for enhanced functionality
publicDashboards = true
alertingPreview = true
enable_alpha = true
newNavigation = true
scenes = true
dashboardPreviews = true
dashboardRestore = true

[security]
# Security settings
admin_user = admin
admin_password = admin
secret_key = SW2YcwTIb9zpOOhoPsMm
disable_gravatar = false
allow_embedding = true
strict_transport_security = false

[auth]
# Authentication settings
disable_login_form = false
disable_signout_menu = false
signout_redirect_url = 
login_maximum_inactive_lifetime_duration = 7d
login_maximum_lifetime_duration = 30d
token_rotation_interval_minutes = 10

[auth.anonymous]
# Anonymous access
enabled = false
org_name = Main Org.
org_role = Viewer

[snapshots]
# Snapshot settings
external_enabled = true
external_snapshot_url = https://snapshots-origin.raintank.io
external_snapshot_name = Publish to snapshot.raintank.io

[dashboards]
# Dashboard settings
versions_to_keep = 20
min_refresh_interval = 5s
default_home_dashboard_path = 

[alerting]
# Alerting configuration
enabled = true
execute_alerts = true
error_or_timeout = alerting
nodata_or_nullvalues = no_data
concurrent_render_limit = 5

[explore]
# Explore configuration
enabled = true

[log]
# Logging configuration
mode = console
level = info
filters = 

[grafana_net]
# Grafana.net integration
url = https://grafana.net

[external_image_storage]
# External image storage
provider = 

[enterprise]
# Enterprise features (if available)
license_path = 

[panels]
# Panel configuration
enable_alpha = true
disable_sanitize_html = false

[plugins]
# Plugin configuration
enable_alpha = true
allow_loading_unsigned_plugins = 

[dataproxy]
# Data proxy settings
logging = false
timeout = 30
send_user_header = false

[analytics]
# Analytics settings
reporting_enabled = true
check_for_updates = true
google_analytics_ua_id = 
google_tag_manager_id = 

[unified_alerting]
# Unified alerting
enabled = true
disabled_orgs = 
admin_config_poll_interval = 60s
alertmanager_config_poll_interval = 60s
ha_listen_address = 
ha_advertise_address = 
ha_peers = 
ha_peer_timeout = 15s
ha_gossip_interval = 200ms
ha_push_pull_interval = 60s
execute_alerts = true
evaluation_timeout = 30s
max_attempts = 3

[users]
# User management
allow_sign_up = true
allow_org_create = true
auto_assign_org = true
auto_assign_org_id = 1
auto_assign_org_role = Viewer
verify_email_enabled = false
login_hint = email or username
password_hint = password
default_theme = dark

[smtp]
# SMTP configuration for email notifications
enabled = false
host = localhost:587
user = 
password = 
cert_file = 
key_file = 
skip_verify = false
from_address = admin@grafana.localhost
from_name = Grafana
ehlo_identity = dashboard.example.com

[emails]
# Email settings
welcome_email_on_sign_up = false
templates_pattern = emails/*.html

[date_formats]
# Date format configuration
full_date = YYYY-MM-DD HH:mm:ss
interval_second = HH:mm:ss
interval_minute = HH:mm
interval_hour = MM/DD HH:mm
interval_day = MM/DD
interval_month = YYYY-MM
interval_year = YYYY

# === HYPERFOCUS ZONE EMPIRE CUSTOM SETTINGS ===
[hyperfocus]
# ADHD-optimized settings for the empire
dopamine_celebrations = true
hyperfocus_alerts = true
neurodivergent_mode = true
legendary_mode = true
broski_optimizations = true

[empire]
# Empire-specific configurations
name = HyperFocus Zone Empire
mode = legendary
auto_coo_enabled = true
agent_army_integration = true
portal_management = true
