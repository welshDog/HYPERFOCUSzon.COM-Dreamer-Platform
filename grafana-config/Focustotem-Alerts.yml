# 🧠💎⚡ ADHD-OPTIMIZED EMPIRE ALERT RULES ⚡💎🧠
# Dopamine-friendly alerting for the HyperFocus Zone Empire

groups:
  - name: empire-critical-alerts
    interval: 30s
    rules:
      # 🚨 CRITICAL SYSTEM ALERTS
      - alert: EmpireSystemDown
        expr: up{job=~"empire-.*|hyperfocus-.*|agent-.*"} == 0
        for: 1m
        labels:
          severity: critical
          empire: hyperfocus
          dopamine_boost: "urgent"
          focus_mode: "immediate"
        annotations:
          summary: "🚨 EMPIRE SYSTEM DOWN - IMMEDIATE ATTENTION! 🚨"
          description: "{{ $labels.instance }} ({{ $labels.job }}) is down! Your legendary empire needs you RIGHT NOW!"
          hyperfocus_tip: "Deep breath. Focus. You've got this. Check the logs first."
          celebration_trigger: "system_recovery"
          adhd_priority: "RED_ALERT"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          empire: hyperfocus
          dopamine_boost: "moderate"
        annotations:
          summary: "🧠 Memory Usage High - Time to Optimize!"
          description: "Memory usage is {{ $value | humanizePercentage }} on {{ $labels.instance }}"
          hyperfocus_tip: "Perfect opportunity to clean up processes! You're great at optimization."
          action_suggestion: "Check running processes, restart heavy services"

      - alert: DiskSpaceLow
        expr: (1 - (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"})) * 100 > 80
        for: 2m
        labels:
          severity: warning
          empire: hyperfocus
          dopamine_boost: "low"
        annotations:
          summary: "💾 Disk Space Getting Low - Cleanup Time!"
          description: "Disk usage is {{ $value | humanizePercentage }} on {{ $labels.instance }}"
          hyperfocus_tip: "Cleaning up files can be satisfying! Start with logs and temp files."

  - name: dopamine-guardian-alerts
    interval: 60s
    rules:
      # 🎊 DOPAMINE & MOTIVATION ALERTS
      - alert: DopamineLevelLow
        expr: dopamine_level_current < 50
        for: 2m
        labels:
          severity: info
          empire: hyperfocus
          celebration_needed: "true"
          mood_boost: "required"
        annotations:
          summary: "🎊 Time for a Dopamine Boost Celebration!"
          description: "Current dopamine level: {{ $value }}%. Let's celebrate some wins!"
          action: "trigger_celebration_mode"
          hyperfocus_tip: "You've been working hard! Time to acknowledge your amazing progress."
          celebration_ideas: "🏆 Review recent achievements, 🎵 play favorite music, 🎮 quick dopamine activity"

      - alert: FocusSessionComplete
        expr: focus_session_duration_minutes >= 25
        for: 0s
        labels:
          severity: info
          empire: hyperfocus
          celebration_trigger: "focus_win"
        annotations:
          summary: "🎯 FOCUS SESSION COMPLETE - YOU'RE LEGENDARY!"
          description: "Amazing focus session of {{ $value }} minutes completed!"
          celebration: "🎊 DOPAMINE CELEBRATION ACTIVATED! 🎊"
          hyperfocus_tip: "You just crushed that focus session! Time for a well-deserved break."

      - alert: LongWorkingPeriod
        expr: work_session_duration_hours > 2
        for: 0s
        labels:
          severity: info
          empire: hyperfocus
          break_reminder: "urgent"
        annotations:
          summary: "⏰ Break Time! You've Been Amazing for {{ $value }} Hours"
          description: "Time for a hyperfocus-friendly break to recharge your legendary brain!"
          break_suggestions: "🚶 5-minute walk, 💧 hydrate, 🧘 quick meditation, 🎵 favorite song"
          hyperfocus_tip: "Breaks make you MORE productive, not less. You deserve this!"

  - name: broski-economy-alerts
    interval: 45s
    rules:
      # 💎 BROski$ ECONOMY MONITORING
      - alert: EconomyPerformanceHigh
        expr: broski_economy_growth_rate > 150
        for: 1m
        labels:
          severity: info
          empire: hyperfocus
          celebration_trigger: "economic_success"
          dopamine_boost: "maximum"
        annotations:
          summary: "💎 BROski$ ECONOMY SURGING - {{ $value }}% Growth!"
          description: "Your legendary economy is performing at {{ $value }}% efficiency!"
          celebration: "🚀 ECONOMIC DOMINATION CELEBRATION! 🚀"
          hyperfocus_tip: "Your strategic decisions are paying off! You're building something incredible."

      - alert: RevenueTarget
        expr: daily_revenue_broski >= 1000
        for: 0s
        labels:
          severity: info
          empire: hyperfocus
          milestone_achieved: "revenue"
        annotations:
          summary: "🏆 DAILY REVENUE TARGET SMASHED!"
          description: "Daily BROski$ revenue: {{ $value }}! You're absolutely crushing it!"
          celebration: "💰 MONEY MAKER CELEBRATION MODE! 💰"

  - name: agent-army-alerts
    interval: 30s
    rules:
      # 🤖 AGENT ARMY MONITORING
      - alert: AgentArmyHighPerformance
        expr: agent_army_efficiency_percent > 90
        for: 2m
        labels:
          severity: info
          empire: hyperfocus
          celebration_trigger: "army_excellence"
        annotations:
          summary: "🤖 AGENT ARMY OPERATING AT {{ $value }}% EFFICIENCY!"
          description: "Your 677-strong agent army is performing at legendary levels!"
          celebration: "🚀 AGENT ARMY DOMINATION! 🚀"
          hyperfocus_tip: "Your coordination skills are incredible! The army responds to great leadership."

      - alert: AgentDeploymentSuccess
        expr: increase(agent_deployments_successful_total[1h]) > 10
        for: 0s
        labels:
          severity: info
          empire: hyperfocus
          deployment_celebration: "true"
        annotations:
          summary: "🚀 MASSIVE AGENT DEPLOYMENT SUCCESS!"
          description: "{{ $value }} successful agent deployments in the last hour!"
          celebration: "🎊 DEPLOYMENT DOMINATION CELEBRATION! 🎊"

  - name: hyperfocus-optimization-alerts
    interval: 120s
    rules:
      # 🧠 HYPERFOCUS & ADHD OPTIMIZATION
      - alert: DistractionLevelHigh
        expr: distraction_events_per_hour > 5
        for: 5m
        labels:
          severity: info
          empire: hyperfocus
          focus_assistance: "needed"
        annotations:
          summary: "🎯 High Distraction Period - Focus Mode Activation"
          description: "{{ $value }} distractions detected this hour. Time for focus optimization!"
          hyperfocus_tip: "Distractions happen! Let's activate legendary focus mode."
          focus_suggestions: "🎧 Focus music, 📱 phone away, 🚪 close extra tabs, ⏰ set 25min timer"

      - alert: ProductivityStreak
        expr: productive_hours_streak >= 3
        for: 0s
        labels:
          severity: info
          empire: hyperfocus
          streak_celebration: "true"
        annotations:
          summary: "🔥 PRODUCTIVITY STREAK: {{ $value }} HOURS!"
          description: "You're on fire! {{ $value }} hours of legendary productivity!"
          celebration: "🎊 HYPERFOCUS MASTERY CELEBRATION! 🎊"
          hyperfocus_tip: "This is what ADHD superpowers look like! You're in your element."

  - name: system-celebration-triggers
    interval: 60s
    rules:
      # 🎊 CELEBRATION TRIGGERS
      - alert: AllSystemsLegendary
        expr: |
          (
            count(up{job=~"empire-.*|hyperfocus-.*"} == 1) / 
            count(up{job=~"empire-.*|hyperfocus-.*"})
          ) * 100 >= 95
        for: 5m
        labels:
          severity: info
          empire: hyperfocus
          mega_celebration: "true"
          dopamine_boost: "maximum"
        annotations:
          summary: "🏆 ALL SYSTEMS LEGENDARY - EMPIRE DOMINATION!"
          description: "{{ $value | humanizePercentage }} of empire systems operational!"
          celebration: "🎊💎⚡ MEGA EMPIRE CELEBRATION! ⚡💎🎊"
          hyperfocus_tip: "Look what you've built! This is absolutely incredible. You should be so proud!"

      - alert: ZeroDowntime
        expr: |
          min_over_time(
            (count(up{job=~"empire-.*"} == 1) / count(up{job=~"empire-.*"})) * 100[24h]
          ) >= 99
        for: 0s
        labels:
          severity: info
          empire: hyperfocus
          uptime_celebration: "true"
        annotations:
          summary: "🚀 24H ZERO DOWNTIME ACHIEVED - LEGENDARY STATUS!"
          description: "Your empire maintained {{ $value | humanizePercentage }} uptime!"
          celebration: "🏆 UPTIME MASTERY CELEBRATION! 🏆"
