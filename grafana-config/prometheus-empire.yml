# 🎯💎⚡ HYPERFOCUS ZONE EMPIRE PROMETHEUS CONFIGURATION ⚡💎🎯
# Custom Prometheus config for legendary empire monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    empire: 'hyperfocus-zone'
    mode: 'legendary'
    broski_level: 'maximum'

# ADHD-optimized alert manager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
      path_prefix: /
      scheme: http
      timeout: 10s
      api_version: v2

# Empire-specific recording and alerting rules
rule_files:
  - "empire_alerts.yml"
  - "dopamine_rules.yml"
  - "broski_economy_rules.yml"

# Legendary scrape configurations for all empire services
scrape_configs:
  # Main Empire Dashboard
  - job_name: 'empire-main-dashboard'
    static_configs:
      - targets: ['localhost:3000']
    metrics_path: /metrics
    scrape_interval: 10s
    honor_labels: true
    params:
      'dopamine_boost': ['true']

  # API Dashboard  
  - job_name: 'empire-api-dashboard'
    static_configs:
      - targets: ['localhost:5000']
    metrics_path: /api/metrics
    scrape_interval: 15s

  # HyperFocus Zone Portal
  - job_name: 'hyperfocus-zone-portal' 
    static_configs:
      - targets: ['localhost:5100']
    metrics_path: /metrics
    scrape_interval: 10s
    honor_labels: true

  # Health Matrix
  - job_name: 'empire-health-matrix'
    static_configs:
      - targets: ['localhost:5001']
    metrics_path: /health/metrics
    scrape_interval: 5s  # High frequency for health monitoring
    honor_labels: true

  # Brain Engine
  - job_name: 'empire-brain-engine'
    static_configs:
      - targets: ['localhost:5002']
    metrics_path: /brain/metrics
    scrape_interval: 10s

  # Team Collaboration Hub
  - job_name: 'team-collaboration'
    static_configs:
      - targets: ['localhost:5555']
    metrics_path: /team/metrics
    scrape_interval: 20s

  # Money Maker (BROski$ Economy)
  - job_name: 'broski-economy'
    static_configs:
      - targets: ['localhost:5007']
    metrics_path: /economy/metrics
    scrape_interval: 30s
    honor_labels: true
    params:
      'currency': ['broski']
      'economy_mode': ['legendary']

  # Command Center
  - job_name: 'empire-command-center'
    static_configs:
      - targets: ['localhost:8080']
    metrics_path: /command/metrics
    scrape_interval: 10s
    honor_labels: true

  # Agent Army
  - job_name: 'agent-army'
    static_configs:
      - targets: ['localhost:8888']
    metrics_path: /agents/metrics
    scrape_interval: 15s
    honor_labels: true
    params:
      'army_size': ['677']
      'coordination_level': ['maximum']

  # Brain Intelligence Engine
  - job_name: 'brain-intelligence'
    static_configs:
      - targets: ['localhost:5010']
    metrics_path: /intelligence/metrics
    scrape_interval: 10s

  # Sync Dashboard
  - job_name: 'sync-dashboard'
    static_configs:
      - targets: ['localhost:9999']
    metrics_path: /sync/metrics
    scrape_interval: 20s

  # System Node Exporter (if available)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']
    metrics_path: /metrics
    scrape_interval: 15s
    honor_labels: true

  # Docker containers (if using)
  - job_name: 'docker'
    static_configs:
      - targets: ['localhost:9323']
    metrics_path: /metrics
    scrape_interval: 30s

  # PostgreSQL (ChaosGenius DB)
  - job_name: 'postgres-chaosgenius'
    static_configs:
      - targets: ['localhost:5432']
    metrics_path: /metrics
    scrape_interval: 30s
    params:
      'database': ['chaosgenius']

  # Redis Cache
  - job_name: 'redis-cache'
    static_configs:
      - targets: ['localhost:6379']
    metrics_path: /metrics  
    scrape_interval: 20s

  # Custom Empire Metrics Endpoint
  - job_name: 'empire-custom-metrics'
    static_configs:
      - targets: ['localhost:9090']  # Self-scraping
    metrics_path: /api/v1/query
    scrape_interval: 60s
    params:
      'query': ['empire_status']

# Remote write to Grafana Cloud (if configured)
remote_write:
  - url: https://prometheus-prod-01-eu-west-0.grafana.net/api/prom/push
    basic_auth:
      username: "welshdog"  # Your Grafana Cloud username 
      password: "glsa_ZCFuem9tYNY9X9HvmKU9Nog0s97cY5nk_ea592832"  # Service account token
    write_relabel_configs:
      - source_labels: [__name__]
        regex: 'empire_.*|dopamine_.*|broski_.*|agent_.*|hyperfocus_.*'
        action: keep
    queue_config:
      capacity: 10000
      max_shards: 1000
      min_shards: 1
      max_samples_per_send: 2000
      batch_send_deadline: 5s
      min_backoff: 30ms
      max_backoff: 100ms
