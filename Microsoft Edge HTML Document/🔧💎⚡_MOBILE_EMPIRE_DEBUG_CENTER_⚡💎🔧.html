<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔧 Mobile Empire Debug Center</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            margin: 0;
        }

        .debug-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            backdrop-filter: blur(10px);
        }

        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
        }

        .success {
            background: rgba(0, 255, 136, 0.2);
        }

        .error {
            background: rgba(255, 107, 107, 0.2);
        }

        .warning {
            background: rgba(255, 193, 7, 0.2);
        }

        button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        #errorLog {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>

<body>
    <h1>🔧 Mobile Empire Debug Center</h1>

    <div class="debug-card">
        <h2>🚨 Error Diagnosis</h2>
        <div id="diagnostics">
            <div class="status" id="serviceWorkerStatus">🔍 Checking Service Worker...</div>
            <div class="status" id="manifestStatus">🔍 Checking PWA Manifest...</div>
            <div class="status" id="scriptsStatus">🔍 Checking JavaScript...</div>
            <div class="status" id="bridgeStatus">🔍 Checking Python Bridge...</div>
        </div>
    </div>

    <div class="debug-card">
        <h2>⚡ Quick Actions</h2>
        <button onclick="testMobileInterface()">🧪 Test Mobile Interface</button>
        <button onclick="checkServiceWorker()">🔄 Check Service Worker</button>
        <button onclick="testWebSocket()">🌐 Test WebSocket</button>
        <button onclick="clearCache()">🗑️ Clear Cache</button>
        <button onclick="openMobileCenter()">📱 Open Mobile Center</button>
    </div>

    <div class="debug-card">
        <h2>📋 Error Log</h2>
        <div id="errorLog">Initializing diagnostic systems...\n</div>
    </div>

    <script>
        let errorLog = document.getElementById('errorLog');

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const prefix = type === 'error' ? '❌' : type === 'success' ? '✅' : '📝';
            errorLog.textContent += `${timestamp} ${prefix} ${message}\n`;
            errorLog.scrollTop = errorLog.scrollHeight;
        }

        function updateStatus(elementId, message, type = 'success') {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.className = `status ${type}`;
        }

        async function runDiagnostics() {
            log('🔍 Starting Mobile Empire diagnostics...');

            // Check Service Worker
            try {
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    if (registrations.length > 0) {
                        updateStatus('serviceWorkerStatus', '✅ Service Worker registered', 'success');
                        log('Service Worker found and registered');
                    } else {
                        updateStatus('serviceWorkerStatus', '⚠️ Service Worker not registered', 'warning');
                        log('Service Worker not registered', 'error');
                    }
                } else {
                    updateStatus('serviceWorkerStatus', '❌ Service Worker not supported', 'error');
                    log('Service Worker not supported in this browser', 'error');
                }
            } catch (error) {
                updateStatus('serviceWorkerStatus', '❌ Service Worker error', 'error');
                log(`Service Worker error: ${error.message}`, 'error');
            }

            // Check Manifest
            try {
                const response = await fetch('./mobile-manifest.json');
                if (response.ok) {
                    const manifest = await response.json();
                    updateStatus('manifestStatus', '✅ PWA Manifest loaded', 'success');
                    log(`PWA Manifest loaded: ${manifest.name}`);
                } else {
                    updateStatus('manifestStatus', '❌ Manifest not found', 'error');
                    log('PWA Manifest not found or invalid', 'error');
                }
            } catch (error) {
                updateStatus('manifestStatus', '❌ Manifest error', 'error');
                log(`Manifest error: ${error.message}`, 'error');
            }

            // Check JavaScript execution
            try {
                // Test if we can access the main HTML file
                const response = await fetch('./📱💎⚡_MOBILE_EMPIRE_COMMAND_CENTER_⚡💎📱.html');
                if (response.ok) {
                    updateStatus('scriptsStatus', '✅ Main interface accessible', 'success');
                    log('Main mobile interface file is accessible');
                } else {
                    updateStatus('scriptsStatus', '❌ Main interface not found', 'error');
                    log('Main mobile interface file not found', 'error');
                }
            } catch (error) {
                updateStatus('scriptsStatus', '❌ Interface access error', 'error');
                log(`Interface access error: ${error.message}`, 'error');
            }

            // Check WebSocket/Python Bridge
            try {
                const ws = new WebSocket('ws://localhost:8765');
                ws.onopen = () => {
                    updateStatus('bridgeStatus', '✅ Python bridge connected', 'success');
                    log('WebSocket connection to Python bridge successful');
                    ws.close();
                };
                ws.onerror = () => {
                    updateStatus('bridgeStatus', '⚠️ Python bridge offline', 'warning');
                    log('Python bridge not running - this is optional for basic functionality', 'error');
                };
                ws.onclose = () => {
                    log('WebSocket connection closed');
                };
            } catch (error) {
                updateStatus('bridgeStatus', '⚠️ WebSocket unavailable', 'warning');
                log(`WebSocket error: ${error.message}`, 'error');
            }

            log('🔍 Diagnostics completed!');
        }

        function testMobileInterface() {
            log('🧪 Testing mobile interface...');
            try {
                window.open('./📱💎⚡_MOBILE_EMPIRE_COMMAND_CENTER_⚡💎📱.html', '_blank');
                log('✅ Mobile interface opened successfully');
            } catch (error) {
                log(`❌ Failed to open mobile interface: ${error.message}`, 'error');
            }
        }

        async function checkServiceWorker() {
            log('🔄 Checking Service Worker status...');
            try {
                if ('serviceWorker' in navigator) {
                    const registration = await navigator.serviceWorker.register('./mobile-sw.js');
                    log('✅ Service Worker registration successful');
                } else {
                    log('❌ Service Worker not supported', 'error');
                }
            } catch (error) {
                log(`❌ Service Worker registration failed: ${error.message}`, 'error');
            }
        }

        function testWebSocket() {
            log('🌐 Testing WebSocket connection...');
            try {
                const ws = new WebSocket('ws://localhost:8765');
                ws.onopen = () => {
                    log('✅ WebSocket connection successful');
                    ws.send(JSON.stringify({ action: 'TEST', timestamp: Date.now() }));
                };
                ws.onmessage = (event) => {
                    log(`📨 WebSocket message received: ${event.data}`);
                };
                ws.onerror = () => {
                    log('❌ WebSocket connection failed', 'error');
                };
                ws.onclose = () => {
                    log('📞 WebSocket connection closed');
                };
            } catch (error) {
                log(`❌ WebSocket test failed: ${error.message}`, 'error');
            }
        }

        async function clearCache() {
            log('🗑️ Clearing cache...');
            try {
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    await Promise.all(cacheNames.map(name => caches.delete(name)));
                    log('✅ Cache cleared successfully');
                } else {
                    log('❌ Cache API not supported', 'error');
                }
            } catch (error) {
                log(`❌ Cache clear failed: ${error.message}`, 'error');
            }
        }

        function openMobileCenter() {
            log('📱 Opening Mobile Empire Command Center...');
            window.location.href = './📱💎⚡_MOBILE_EMPIRE_COMMAND_CENTER_⚡💎📱.html';
        }

        // Capture console errors
        window.addEventListener('error', (event) => {
            log(`❌ JavaScript Error: ${event.message} at ${event.filename}:${event.lineno}`, 'error');
        });

        window.addEventListener('unhandledrejection', (event) => {
            log(`❌ Unhandled Promise Rejection: ${event.reason}`, 'error');
        });

        // Run diagnostics on load
        window.addEventListener('load', runDiagnostics);

        log('🔧 Mobile Empire Debug Center initialized');
    </script>
</body>

</html>
