# 🌌♾️⚡ HYPERFOCUS EMPIRE REDIS CONFIGURATION ⚡♾️🌌
# Ultra-Performance Caching for Empire Systems

# Network and connection settings
bind 0.0.0.0
port 6379
timeout 300
tcp-keepalive 300

# Memory management for empire performance
maxmemory 256mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Persistence configuration
save 900 1
save 300 10
save 60 10000

# Enable AOF for data durability
appendonly yes
appendfilename "empire-redis.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Slow log configuration
slowlog-log-slower-than 10000
slowlog-max-len 128

# Client configuration
timeout 0
tcp-keepalive 300

# Logging
loglevel notice
logfile ""

# Empire-specific settings
databases 16

# Performance tuning for empire workloads
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# Notification settings for empire events
notify-keyspace-events Ex

# Security (update for production)
# requirepass legendary_redis_password

# Disable dangerous commands in production
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command CONFIG ""
