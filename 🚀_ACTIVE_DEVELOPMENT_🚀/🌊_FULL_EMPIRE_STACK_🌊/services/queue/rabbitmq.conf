# 🌌♾️⚡ HYPERFOCUS EMPIRE RABBITMQ CONFIGURATION ⚡♾️🌌
# Ultra-Reliable Message Queue for Empire Operations

# Cluster configuration
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@hyperfocus-rabbitmq

# Memory and disk management
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB

# Networking
listeners.tcp.default = 5672
management.listener.port = 15672
management.listener.ssl = false

# Logging
log.console = true
log.console.level = info
log.file = /var/log/rabbitmq/rabbit.log
log.file.level = info

# Performance tuning for empire workloads
channel_max = 2047
heartbeat = 600
frame_max = 131072

# Management plugin
management.rates_mode = basic

# Empire-specific settings
default_user = empire_user
default_pass = legendary_pass
default_vhost = /
default_user_tags.administrator = true

# Queue defaults optimized for empire operations
default_permissions.configure = .*
default_permissions.read = .*
default_permissions.write = .*

# Load definitions on startup
management.load_definitions = /etc/rabbitmq/definitions.json

# SSL configuration (for production)
# ssl_options.cacertfile = /etc/rabbitmq/ssl/ca_certificate.pem
# ssl_options.certfile = /etc/rabbitmq/ssl/server_certificate.pem
# ssl_options.keyfile = /etc/rabbitmq/ssl/server_key.pem
# ssl_options.verify = verify_peer
# ssl_options.fail_if_no_peer_cert = true

# Prometheus metrics (if enabled)
# prometheus.tcp.port = 15692
