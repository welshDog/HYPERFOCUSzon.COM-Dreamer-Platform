name: 🚀 HyperFocus Zone Empire CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 🧪 Testing Pipeline
  test:
    name: 🧪 Test Ultra-Thinking Boardroom
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10', '3.11']

    steps:
    - name: 📦 Checkout Repository
      uses: actions/checkout@v4

    - name: 🐍 Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: 📋 Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 🧪 Run Tests
      run: |
        python -m pytest tests/ --cov=core/ --cov-report=xml

    - name: 📊 Upload Coverage Reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  # 🐳 Docker Build Pipeline
  docker-build:
    name: 🐳 Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
    - name: 📦 Checkout Repository
      uses: actions/checkout@v4

    - name: 🔐 Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 📝 Extract Metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha
          type=raw,value=latest,enable={{is_default_branch}}

    - name: 🏗️ Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  # 🌐 Deploy to GitHub Pages
  deploy-pages:
    name: 🌐 Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: 📦 Checkout Repository
      uses: actions/checkout@v4

    - name: 🔧 Setup Pages
      uses: actions/configure-pages@v4

    - name: 📦 Upload Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: web/

    - name: 🚀 Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  # 📢 Release Creation
  release:
    name: 📢 Create Release
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: github.ref == 'refs/heads/main' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
    - name: 📦 Checkout Repository
      uses: actions/checkout@v4

    - name: 🏷️ Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: HyperFocus Zone Empire ${{ github.ref }}
        body: |
          🌟 **HyperFocus Zone Empire Release**

          ## 🚀 What's New
          - Ultra-Thinking Boardroom enhancements
          - Windsurf AI integration improvements
          - Docker empire stack optimizations
          - Performance and stability improvements

          ## 📦 Installation
          ```bash
          git clone https://github.com/welshDog/HYPERFOCUSzon.COM-V10.git
          cd HYPERFOCUSzon.COM-V10
          python core/ultra_thinking_boardroom_local.py
          ```

          ## 🐳 Docker Quick Start
          ```bash
          cd docker/
          docker-compose -f docker-compose.empire.yml up -d
          ```
        draft: false
        prerelease: false

  # 🔍 Security Scan
  security:
    name: 🔍 Security Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: 📦 Checkout Repository
      uses: actions/checkout@v4

    - name: 🔍 Run Trivy Vulnerability Scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: 📊 Upload Trivy Scan Results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  # 📊 Performance Monitoring
  performance:
    name: 📊 Performance Monitoring
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: 📦 Checkout Repository
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 📋 Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest-benchmark
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: ⚡ Run Performance Tests
      run: |
        python -m pytest tests/performance/ --benchmark-only --benchmark-json=benchmark.json

    - name: 📊 Store Benchmark Results
      uses: benchmark-action/github-action-benchmark@v1
      with:
        tool: 'pytest'
        output-file-path: benchmark.json
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: true
