# 🚀💎⚡ GRAFANA v12.1 EMPIRE OPTIMIZATION CONFIGURATION ⚡💎🚀
# Custom Grafana configuration for legendary empire monitoring

[server]
# Enhanced server configuration for empire-level performance
protocol = http
http_addr = 
http_port = 3000
domain = localhost
enforce_domain = false
root_url = %(protocol)s://%(domain)s:%(http_port)s/
serve_from_sub_path = false

[feature_toggles]
# 🎯 NEW v12.1 LEGENDARY FEATURES ACTIVATED!
grafanaAdvisor = true              # 🚨 AUTOMATIC HEALTH MONITORING
alertingListViewV2 = true          # ⚡ ENHANCED ALERT MANAGEMENT  
trendlines = true                  # 📈 PREDICTIVE ANALYTICS
contextualRootCause = true         # 🔍 AI-POWERED PROBLEM DETECTION
customVariableActions = true       # 🎛️ DYNAMIC INTERACTIVE CONTROLS

# Additional empire-enhancing features
publicDashboards = true
alertingPreview = true
enable_alpha = true
newNavigation = true
scenes = true
dashboardPreviews = true
dashboardRestore = true
prometheusMetricEncyclopedia = true

[time_picker]
# 🎯 HYPERFOCUS ZONE EMPIRE CUSTOM TIME RANGES
quick_ranges = """[
{"from":"now-4h","to":"now","display":"🧠 Hyperfocus Session"},
{"from":"now-8h","to":"now","display":"⚡ Extended Focus Zone"},
{"from":"now-1d","to":"now","display":"🏰 Empire Daily Status"},
{"from":"now-3d","to":"now","display":"💎 Epic Build Cycle"},
{"from":"now-1w","to":"now","display":"👑 Weekly Empire Growth"},
{"from":"now-1M","to":"now","display":"🚀 Monthly Conquest Review"},
{"from":"now/d","to":"now/d","display":"📊 Today's Empire Stats"},
{"from":"now-1d/d","to":"now-1d/d","display":"📈 Yesterday's Performance"}
]"""

[analytics]
# Empire analytics for legendary insights
enabled = true
reporting_enabled = true
check_for_updates = true

[log]
# Enhanced logging for empire monitoring
mode = console file
level = info
format = console

[paths]
# Empire data storage paths
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[security]
# Legendary empire security settings
admin_user = admin
admin_password = BROski2025!
secret_key = HyperFocusZoneEmpireLegendaryKey2025
cookie_secure = false
cookie_samesite = lax
allow_embedding = true

[users]
# Empire user management
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_id = 1
auto_assign_org_role = Viewer
default_theme = dark

[unified_alerting]
# 🚨 ENHANCED ALERTING FOR EMPIRE MONITORING
enabled = true
ha_peers = ""
ha_listen_address = "0.0.0.0:9094"
ha_advertise_address = ""
ha_peer_timeout = "15s"
ha_gossip_interval = "200ms"
ha_push_pull_interval = "60s"
max_attempts = 3
min_interval = 10s

[alerting]
# Empire-specific alert settings
enabled = true
execute_alerts = true
error_or_timeout = alerting
nodata_or_nullvalues = no_data
concurrent_render_limit = 5
evaluation_timeout_seconds = 30
notification_timeout_seconds = 30
max_annotation_age = 0
max_annotations_to_keep = 0
