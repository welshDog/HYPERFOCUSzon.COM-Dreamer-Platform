version: '3.8'
networks:
  pi-microcloud:
    driver: bridge
    ipam:
      config:
      - subnet: 172.20.0.0/16
  empire-bridge:
    external: true
volumes:
  nginx-config: {}
  redis-data: {}
  broski-logs: {}
  monitoring-data: {}
services:
  pi-nginx:
    image: nginx:alpine
    container_name: pi-nginx-gateway
    restart: unless-stopped
    ports:
    - 80:80
    - 443:443
    volumes:
    - ./nginx/pi-nginx.conf:/etc/nginx/nginx.conf:ro
    - nginx-config:/etc/nginx/conf.d
    - broski-logs:/var/log/nginx
    networks:
    - pi-microcloud
    - empire-bridge
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.3'
        reservations:
          memory: 64M
          cpus: '0.1'
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://localhost/health
      interval: 30s
      timeout: 5s
      retries: 3
  pi-redis:
    image: redis:alpine
    container_name: pi-redis-cache
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
    - 6379:6379
    volumes:
    - redis-data:/data
    networks:
    - pi-microcloud
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.2'
        reservations:
          memory: 128M
          cpus: '0.1'
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 30s
      timeout: 5s
      retries: 3
  pi-monitor:
    image: prom/node-exporter:latest
    container_name: pi-node-exporter
    restart: unless-stopped
    ports:
    - 9100:9100
    volumes:
    - /proc:/host/proc:ro
    - /sys:/host/sys:ro
    - /:/rootfs:ro
    command:
    - --path.procfs=/host/proc
    - --path.rootfs=/rootfs
    - --path.sysfs=/host/sys
    - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    networks:
    - pi-microcloud
    - empire-bridge
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
        reservations:
          memory: 64M
          cpus: '0.1'
  pi-broski-agent:
    image: python:3.11-alpine
    container_name: pi-broski-agent
    restart: unless-stopped
    working_dir: /app
    environment:
      BROSKI_MODE: PI_EDGE
      EMPIRE_NODE_TYPE: MICRO_CLOUD
      PI_NODE_ID: broski-pi-node-01
      REDIS_URL: redis://pi-redis:6379
      LAPTOP_OFFLOADING_ENABLED: 'true'
    ports:
    - 8080:8080
    volumes:
    - ./agent:/app
    - broski-logs:/app/logs
    networks:
    - pi-microcloud
    - empire-bridge
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.2'
    depends_on:
    - pi-redis
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://localhost:8080/health
      interval: 60s
      timeout: 10s
      retries: 3
    command: sh -c "pip install aiohttp redis psutil && python /app/pi_broski_agent.py"
