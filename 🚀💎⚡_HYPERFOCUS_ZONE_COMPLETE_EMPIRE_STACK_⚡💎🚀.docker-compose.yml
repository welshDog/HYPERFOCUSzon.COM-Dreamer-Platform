version: '3.8'

# 🚀💎⚡ HYPERFOCUS ZONE COMPLETE EMPIRE STACK ⚡💎🚀
# Ultimate Docker Compose for 100% Empire Perfection
# Integrates ALL empire services for one-command deployment

services:
  # 🧠 Neurodivergent AI Core
  neurodivergent_ai:
    build:
      context: .
      dockerfile: Dockerfile.neurodivergent-ai
    container_name: hyperfocus_neurodivergent_ai
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      - AI_MODE=neurodivergent
      - ADHD_SUPPORT=enabled
      - AUTISM_SUPPORT=enabled
      - CRISIS_DETECTION=enabled
      - MEMORY_CRYSTALS_PATH=/app/memory_crystals
    volumes:
      - ./memory_crystals:/app/memory_crystals:ro
      - ./neurodivergent_logs:/app/logs
      - ./ai_models:/app/models
    networks:
      - empire_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 🌈 Leantime Project Management
  leantime:
    image: leantime/leantime:latest
    container_name: hyperfocus_leantime
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - LEAN_DB_HOST=empire_db
      - LEAN_DB_USER=empire_user
      - LEAN_DB_PASSWORD=${DB_PASSWORD}
      - LEAN_DB_DATABASE=leantime_db
      - LEAN_SITENAME=HyperFocus Zone Empire
      - LEAN_APP_URL=http://localhost:8080
      - LEAN_SESSION_PASSWORD=${SESSION_PASSWORD}
    volumes:
      - leantime_files:/var/www/html/userfiles
      - leantime_logs:/var/log/leantime
      - ./leantime-config:/var/www/html/config
    depends_on:
      - empire_db
      - empire_redis
    networks:
      - empire_network

  # 🗄️ PostgreSQL Database (Empire Central)
  empire_db:
    image: postgres:15
    container_name: hyperfocus_empire_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=empire_central
      - POSTGRES_USER=empire_user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_MULTIPLE_DATABASES=leantime_db,broski_db,discord_db
    volumes:
      - empire_db_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    networks:
      - empire_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U empire_user -d empire_central"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 🔄 Redis Cache & Session Store
  empire_redis:
    image: redis:7-alpine
    container_name: hyperfocus_empire_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - empire_redis_data:/data
    networks:
      - empire_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 🌐 Nginx Reverse Proxy & Load Balancer
  empire_nginx:
    image: nginx:alpine
    container_name: hyperfocus_empire_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./static:/var/www/static:ro
    depends_on:
      - neurodivergent_ai
      - leantime
      - grafana
      - discord_bot
    networks:
      - empire_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 📊 Grafana Empire Monitoring
  grafana:
    image: grafana/grafana:latest
    container_name: hyperfocus_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - GF_RENDERING_SERVER_URL=http://grafana_renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - empire_network

  # 📈 Prometheus Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: hyperfocus_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - empire_network

  # 🤖 Discord Bot Empire
  discord_bot:
    build:
      context: .
      dockerfile: Dockerfile.discord-bot
    container_name: hyperfocus_discord_bot
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DB_HOST=empire_db
      - DB_USER=empire_user
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=discord_db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@empire_redis:6379
      - AI_API_URL=http://neurodivergent_ai:8888
    volumes:
      - ./discord_logs:/app/logs
      - ./memory_crystals:/app/memory_crystals:ro
    depends_on:
      - empire_db
      - empire_redis
      - neurodivergent_ai
    networks:
      - empire_network

  # 🔍 Elasticsearch for Logs & Search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: hyperfocus_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - empire_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 📝 Kibana for Log Analysis
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: hyperfocus_kibana
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - empire_network

  # 📊 Node Exporter for System Metrics
  node_exporter:
    image: prom/node-exporter:latest
    container_name: hyperfocus_node_exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - empire_network

  # 🔄 Portainer for Container Management
  portainer:
    image: portainer/portainer-ce:latest
    container_name: hyperfocus_portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - empire_network

  # 🧹 Watchtower for Auto-Updates
  watchtower:
    image: containrrr/watchtower
    container_name: hyperfocus_watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 86400 --cleanup
    networks:
      - empire_network

  # ⚡ Model Runner for Local AI
  model_runner:
    image: ghcr.io/mudler/localai:latest
    container_name: hyperfocus_model_runner
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - MODELS_PATH=/models
      - PRELOAD_MODELS_CONFIG=/models/preload_models.yaml
    volumes:
      - ./ai_models:/models
      - model_runner_data:/tmp/localai
    networks:
      - empire_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 🧪 Testcontainers Test Runner
  test_runner:
    build:
      context: .
      dockerfile: Dockerfile.test-runner
    container_name: hyperfocus_test_runner
    restart: "no"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./tests:/app/tests
      - ./test_results:/app/results
    networks:
      - empire_network
    profiles:
      - testing

  # 🎨 React Development Server (for DREAMER Portal)
  react_dev:
    build:
      context: .
      dockerfile: Dockerfile.react-dev
    container_name: hyperfocus_react_dev
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8888
      - REACT_APP_LEANTIME_URL=http://localhost:8080
      - REACT_APP_GRAFANA_URL=http://localhost:3000
    volumes:
      - ./react_src:/app/src
      - ./react_public:/app/public
      - react_node_modules:/app/node_modules
    networks:
      - empire_network
    profiles:
      - development

volumes:
  # Empire Core Data
  empire_db_data:
    name: hyperfocus_empire_database
  empire_redis_data:
    name: hyperfocus_empire_redis

  # Application Data
  leantime_files:
    name: hyperfocus_leantime_files
  leantime_logs:
    name: hyperfocus_leantime_logs

  # Monitoring Data
  grafana_data:
    name: hyperfocus_grafana_data
  prometheus_data:
    name: hyperfocus_prometheus_data
  elasticsearch_data:
    name: hyperfocus_elasticsearch_data

  # AI & Development
  model_runner_data:
    name: hyperfocus_model_runner_data
  react_node_modules:
    name: hyperfocus_react_node_modules

  # Management
  portainer_data:
    name: hyperfocus_portainer_data

networks:
  empire_network:
    name: hyperfocus_empire_network
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
    labels:
      - "com.hyperfocus.network=empire"
      - "com.hyperfocus.purpose=complete-integration"

# 🏷️ Empire Labels & Metadata
x-empire-labels: &empire-labels
  com.hyperfocus.empire: "true"
  com.hyperfocus.version: "1.0.0"
  com.hyperfocus.purpose: "neurodivergent-empowerment"
  com.hyperfocus.perfection: "100%"

# 🚀 Deployment Profiles
# Production: docker-compose up -d
# Development: docker-compose --profile development up -d
# Testing: docker-compose --profile testing up test_runner
# Full Stack: docker-compose --profile development --profile testing up -d
