# 🐳 HyperFocus Zone System Monitor - Docker Compose Configuration
# Production-ready multi-service architecture

version: '3.8'

services:
  # Main System Monitor Service
  system-monitor:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_VERSION=${APP_VERSION:-1.0.0}
        - BUILD_DATE=${BUILD_DATE}
        - VCS_REF=${VCS_REF}
    container_name: hyperfocus-system-monitor
    hostname: system-monitor
    restart: unless-stopped

    # Environment configuration
    environment:
      - MONITORING_INTERVAL=${MONITORING_INTERVAL:-5}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ALERT_CPU_THRESHOLD=${ALERT_CPU_THRESHOLD:-80}
      - ALERT_MEMORY_THRESHOLD=${ALERT_MEMORY_THRESHOLD:-85}
      - ALERT_DISK_THRESHOLD=${ALERT_DISK_THRESHOLD:-90}
      - ENABLE_ALERTS=${ENABLE_ALERTS:-true}
      - EXPORT_METRICS=${EXPORT_METRICS:-true}
      - TZ=UTC

    # Resource limits for container optimization
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

    # Volume mounts for data persistence
    volumes:
      - monitor_data:/app/data
      - monitor_config:/app/config
      - monitor_logs:/app/logs
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

    # Network configuration
    networks:
      - monitoring_network

    # Port mapping (for future web interface)
    ports:
      - "8080:8080"

    # Health check configuration
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Security options
    security_opt:
      - no-new-privileges:true
    read_only: false

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Dependencies
    depends_on:
      - redis
      - postgres

  # Redis for caching and real-time data
  redis:
    image: redis:7-alpine
    container_name: hyperfocus-redis
    hostname: redis
    restart: unless-stopped

    # Redis configuration
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-hyperfocus123}

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

    # Volume for Redis persistence
    volumes:
      - redis_data:/data

    # Network
    networks:
      - monitoring_network

    # Health check
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

    # Security
    security_opt:
      - no-new-privileges:true

  # PostgreSQL for long-term metrics storage
  postgres:
    image: postgres:15-alpine
    container_name: hyperfocus-postgres
    hostname: postgres
    restart: unless-stopped

    # Environment variables
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-hyperfocus_monitoring}
      - POSTGRES_USER=${POSTGRES_USER:-hyperfocus}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-hyperfocus_secure_123}
      - PGDATA=/var/lib/postgresql/data/pgdata

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

    # Volume for database persistence
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d

    # Network
    networks:
      - monitoring_network

    # Health check
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hyperfocus}"]
      interval: 10s
      timeout: 5s
      retries: 3

    # Security
    security_opt:
      - no-new-privileges:true

  # Grafana for visualization dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: hyperfocus-grafana
    hostname: grafana
    restart: unless-stopped

    # Environment configuration
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=redis-datasource

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

    # Volume for Grafana data
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources

    # Network and ports
    networks:
      - monitoring_network
    ports:
      - "3000:3000"

    # Dependencies
    depends_on:
      - postgres
      - redis

    # Health check
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

    # Security
    security_opt:
      - no-new-privileges:true

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: hyperfocus-nginx
    hostname: nginx
    restart: unless-stopped

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M

    # Configuration and certificates
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_logs:/var/log/nginx

    # Network and ports
    networks:
      - monitoring_network
    ports:
      - "80:80"
      - "443:443"

    # Dependencies
    depends_on:
      - system-monitor
      - grafana

    # Health check
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

    # Security
    security_opt:
      - no-new-privileges:true

# Named volumes for data persistence
volumes:
  monitor_data:
    driver: local
    name: hyperfocus_monitor_data
  monitor_config:
    driver: local
    name: hyperfocus_monitor_config
  monitor_logs:
    driver: local
    name: hyperfocus_monitor_logs
  redis_data:
    driver: local
    name: hyperfocus_redis_data
  postgres_data:
    driver: local
    name: hyperfocus_postgres_data
  grafana_data:
    driver: local
    name: hyperfocus_grafana_data
  nginx_logs:
    driver: local
    name: hyperfocus_nginx_logs

# Custom network for service communication
networks:
  monitoring_network:
    driver: bridge
    name: hyperfocus_monitoring
    ipam:
      config:
        - subnet: 172.20.0.0/16
