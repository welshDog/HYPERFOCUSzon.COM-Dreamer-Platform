# 🔥⚡💎 ULTIMATE NGINX GLOBAL CDN CONFIGURATION ⚡💎🔥
# HYPERFOCUS ZONE EMPIRE - LEGENDARY WEB SERVER DEPLOYMENT
# Optimized for Phase 4 Global Expansion & AI Cabin Fusion Services

# Main HTTP block configuration
http {
    # Basic Settings - Legendary Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # File Upload Limits - Support large AI cabin media
    client_max_body_size 100M;
    client_body_buffer_size 16K;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # MIME Types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging Configuration - Track global empire operations
    log_format legendary_empire '$remote_addr - $remote_user [$time_local] '
                                '"$request" $status $body_bytes_sent '
                                '"$http_referer" "$http_user_agent" '
                                'rt=$request_time uct="$upstream_connect_time" '
                                'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/legendary_empire_access.log legendary_empire;
    error_log /var/log/nginx/legendary_empire_error.log warn;

    # Gzip Compression - Maximum efficiency for global delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Rate Limiting - Protect against attacks while serving globally
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=cabin:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=global:10m rate=100r/s;

    # SSL/TLS Configuration - Fortress-level security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers - Maximum protection
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Upstream Backend Servers - Phase 4 Global Infrastructure
    upstream hyperfocus_app {
        least_conn;
        server 127.0.0.1:3000 weight=3 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:3001 weight=2 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:3002 weight=2 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream ai_cabin_services {
        least_conn;
        server 127.0.0.1:4000 weight=3 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:4001 weight=3 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:4002 weight=2 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream agent_army_api {
        least_conn;
        server 127.0.0.1:5000 weight=3 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:5001 weight=3 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:5002 weight=2 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Main Server Block - HYPERFOCUS ZONE EMPIRE
    server {
        listen 80;
        listen [::]:80;
        server_name hyperfocuszone.com www.hyperfocuszone.com;
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name hyperfocuszone.com www.hyperfocuszone.com;

        # SSL Certificate Configuration (Replace with actual certificates)
        ssl_certificate /etc/ssl/certs/hyperfocuszone.com.pem;
        ssl_certificate_key /etc/ssl/private/hyperfocuszone.com.key;

        # Document Root
        root /var/www/hyperfocus_empire/public;
        index index.html index.php index.htm;

        # Main Application Routes
        location / {
            try_files $uri $uri/ @hyperfocus_app;
            limit_req zone=global burst=20 nodelay;
        }

        location @hyperfocus_app {
            proxy_pass http://hyperfocus_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # AI Cabin Fusion Services
        location /api/cabin/ {
            proxy_pass http://ai_cabin_services;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            limit_req zone=cabin burst=10 nodelay;
            
            # Enhanced timeouts for AI processing
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # 677+ Agent Army API
        location /api/agents/ {
            proxy_pass http://agent_army_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            limit_req zone=api burst=15 nodelay;
            
            # Long timeouts for agent operations
            proxy_connect_timeout 180s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
        }

        # Static Assets - Maximum caching for global CDN
        location /static/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Served-By "HyperFocus-CDN";
            try_files $uri =404;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Served-By "HyperFocus-CDN";
            try_files $uri =404;
        }

        # Security - Block unwanted access
        location ~ /\. {
            deny all;
        }

        location ~* \.(env|log|ini)$ {
            deny all;
        }

        # Health Check Endpoint
        location /health {
            access_log off;
            return 200 "HYPERFOCUS ZONE EMPIRE - LEGENDARY STATUS ACTIVE\n";
            add_header Content-Type text/plain;
        }

        # Mobile PWA Manifest and Service Worker
        location /manifest.json {
            add_header Cache-Control "public, max-age=86400";
            try_files $uri =404;
        }

        location /sw.js {
            add_header Cache-Control "public, max-age=0, must-revalidate";
            try_files $uri =404;
        }

        # Error Pages - Branded for empire
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        location = /404.html {
            root /var/www/hyperfocus_empire/errors;
            internal;
        }

        location = /50x.html {
            root /var/www/hyperfocus_empire/errors;
            internal;
        }
    }

    # AI Cabin Fusion Subdomain
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name cabin.hyperfocuszone.com;

        ssl_certificate /etc/ssl/certs/cabin.hyperfocuszone.com.pem;
        ssl_certificate_key /etc/ssl/private/cabin.hyperfocuszone.com.key;

        location / {
            proxy_pass http://ai_cabin_services;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            limit_req zone=cabin burst=20 nodelay;
        }
    }

    # Agent Army Management Subdomain  
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name agents.hyperfocuszone.com;

        ssl_certificate /etc/ssl/certs/agents.hyperfocuszone.com.pem;
        ssl_certificate_key /etc/ssl/private/agents.hyperfocuszone.com.key;

        location / {
            proxy_pass http://agent_army_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            limit_req zone=api burst=30 nodelay;
        }
    }

    # WebSocket Support for Real-time Cabin Interactions
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Global CDN Cache Configuration
    proxy_cache_path /var/cache/nginx/hyperfocus levels=1:2 keys_zone=hyperfocus_cache:100m max_size=10g inactive=60m use_temp_path=off;

    # Cache for static content
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_cache hyperfocus_cache;
        proxy_cache_valid 200 1y;
        proxy_cache_valid 404 1m;
        add_header X-Cache-Status $upstream_cache_status;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# Event-driven configuration for maximum performance
events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

# Global Configuration
user www-data;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;

# Performance Tuning Comments:
# This configuration is optimized for:
# - Global CDN deployment with maximum caching
# - AI Cabin Fusion service integration
# - 677+ Agent Army API management
# - Mobile PWA support with service workers
# - WebSocket connections for real-time interactions
# - Security headers and rate limiting
# - Load balancing across multiple backend servers
# - SSL/TLS termination with modern protocols
# - Error handling and health monitoring

