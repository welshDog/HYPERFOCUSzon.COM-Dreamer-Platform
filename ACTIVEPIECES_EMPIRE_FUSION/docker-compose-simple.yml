version: '3.8'

services:
  activepieces:
    image: activepieces/activepieces:latest
    ports:
      - "8080:80"
    environment:
      - AP_ENGINE_EXECUTABLE_PATH=dist/packages/engine/main.js
      - AP_FRONTEND_URL=http://localhost:8080
      - AP_ENCRYPTION_KEY=hyperfocus_zone_super_secret_key_change_me_later
      - AP_JWT_SECRET=hyperfocus_zone_jwt_secret_key_change_me_later
      - AP_DB_TYPE=SQLITE3
      - AP_REDIS_URL=redis://redis:6379
      - AP_TRIGGER_DEFAULT_POLL_INTERVAL=5
      - AP_SIGN_UP_ENABLED=true
      - AP_TELEMETRY_ENABLED=false
      - AP_TEMPLATES_SOURCE_URL=https://cloud.activepieces.com/api/v1/flow-templates
    volumes:
      - activepieces_data:/opt/activepieces/dist/packages/server/api/src/assets
    depends_on:
      - redis
    networks:
      - hyperfocus_empire_network

  redis:
    image: redis:alpine
    networks:
      - hyperfocus_empire_network
    volumes:
      - redis_data:/data

volumes:
  activepieces_data:
  redis_data:

networks:
  hyperfocus_empire_network:
    driver: bridge
