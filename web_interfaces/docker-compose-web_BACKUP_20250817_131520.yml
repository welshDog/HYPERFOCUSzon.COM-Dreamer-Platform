version: '3.8'

services:
  smollm2-web-interface:
    build:
      context: .
      dockerfile: Dockerfile.gradio
    ports:
      - "7860:7860"
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - SMOLLM2_API_BASE=http://host.docker.internal:11435
      - LEGENDARY_MODE=true
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - smollm2-network
    labels:
      - "ai.hyperfocus.service=smollm2-web"
      - "ai.hyperfocus.type=gradio-interface"
      - "ai.hyperfocus.legendary=true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  smollm2-network:
    driver: bridge

volumes:
  smollm2_web_data:
    driver: local
