# GitHub Pages Configuration for HYPERFOCUS-ZONE-TEST-INFO-SYSTEM
url: "https://welshdog.github.io/HYPERFOCUS-ZONE-TEST-INFO-SYSTEM"
baseurl: "/HYPERFOCUS-ZONE-TEST-INFO-SYSTEM"

# Site settings
title: Hyperfocus Zone Test Info System
description: Professional showcase powered by HYPERFOCUS Zone
author: welshDog

# Build settings
markdown: kramdown
highlighter: rouge
theme: minima

# GitHub Pages specific settings
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude files from processing
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/

# Collections
collections:
  docs:
    output: true
    permalink: /:collection/:name/

# Default settings
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "docs"
    values:
      layout: "page"
