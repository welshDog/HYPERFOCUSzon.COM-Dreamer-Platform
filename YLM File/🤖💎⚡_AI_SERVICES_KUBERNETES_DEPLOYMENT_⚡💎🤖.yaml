# SmolLM2 AI Engine Deployment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smollm2-ai-engine-legendary
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smollm2-ai-engine
  template:
    metadata:
      labels:
        app: smollm2-ai-engine
    spec:
      containers:
      - env:
        - name: MODEL_NAME
          value: SmolLM2
        - name: MAX_TOKENS
          value: '8192'
        - name: TEMPERATURE
          value: '0.7'
        - name: LEGENDARY_MODE
          value: 'true'
        image: python:3.11-slim
        name: smollm2-ai-engine
        ports:
        - containerPort: 11435
        resources:
          limits:
            cpu: '2'
            memory: 4Gi
          requests:
            cpu: '1'
            memory: 2Gi
      - env:
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              key: TS_AUTHKEY
              name: tailscale-auth
        - name: TS_HOSTNAME
          value: smollm2-direct
        - name: TS_DEST_IP
          value: 127.0.0.1:11435
        image: tailscale/tailscale:latest
        name: tailscale-sidecar
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
---
apiVersion: v1
kind: Service
metadata:
  name: smollm2-ai-engine-service
  namespace: default
spec:
  ports:
  - port: 11435
    targetPort: 11435
  selector:
    app: smollm2-ai-engine
  type: ClusterIP

# Gradio Web Interface Deployment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gradio-web-interface-legendary
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gradio-web-interface
  template:
    metadata:
      labels:
        app: gradio-web-interface
    spec:
      containers:
      - env:
        - name: GRADIO_SERVER_NAME
          value: 0.0.0.0
        - name: GRADIO_SERVER_PORT
          value: '7862'
        - name: LEGENDARY_MODE
          value: 'true'
        image: python:3.11-slim
        name: gradio-interface
        ports:
        - containerPort: 7862
        resources:
          limits:
            cpu: '1'
            memory: 2Gi
          requests:
            cpu: '0.5'
            memory: 1Gi
      - env:
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              key: TS_AUTHKEY
              name: tailscale-auth
        - name: TS_HOSTNAME
          value: gradio-direct
        - name: TS_DEST_IP
          value: 127.0.0.1:7862
        image: tailscale/tailscale:latest
        name: tailscale-sidecar
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
---
apiVersion: v1
kind: Service
metadata:
  name: gradio-web-interface-service
  namespace: default
spec:
  ports:
  - port: 7862
    targetPort: 7862
  selector:
    app: gradio-web-interface
  type: ClusterIP
